name: SSH Tunnel Debug (ngrok)

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Durée max du tunnel (minutes)"
        required: false
        default: "30"

jobs:
  ssh-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Générer les clés SSH
        run: |
          rm -rf ~/.ssh
          mkdir -p ~/.ssh
          ssh-keygen -f ~/.ssh/id_rsa -N ""
          cp ~/.ssh/id_rsa.pub ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys

      - name: Sauvegarder la clé privée comme artifact protégé
        uses: actions/upload-artifact@v4
        with:
          name: ssh-private-key
          path: ~/.ssh/id_rsa
          retention-days: 1

      - name: Installer sshd (paquet système, plus simple que le binaire statique)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo mkdir -p /var/run/sshd

      - name: Configurer sshd
        run: |
          sudo tee /etc/ssh/sshd_config.d/99-debug.conf > /dev/null << 'EOF'
          Port 2222
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
          AuthorizedKeysFile /home/runner/.ssh/authorized_keys
          PermitUserEnvironment yes
          AcceptEnv PATH LD_LIBRARY_PATH
          Subsystem sftp internal-sftp
          EOF

      - name: Démarrer sshd
        run: |
          sudo /usr/sbin/sshd -D -e -f /etc/ssh/sshd_config &
          sleep 2
          ss -tlnp 2>/dev/null | grep :2222 || echo "ATTENTION: sshd ne semble pas écouter sur 2222"

      - name: Installer ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq ngrok
          ngrok version

      - name: Configurer le token ngrok
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
        run: ngrok config add-authtoken "$NGROK_TOKEN"

      - name: Lancer le tunnel ngrok
        run: |
          nohup ngrok tcp 2222 --log=stdout > /tmp/ngrok.log 2>&1 &
          sleep 5
          cat /tmp/ngrok.log

      - name: Récupérer et afficher l'URL du tunnel
        run: |
          for i in $(seq 1 10); do
            RESPONSE=$(curl -s http://localhost:4040/api/tunnels || true)
            URL=$(echo "$RESPONSE" | grep -o '"public_url":"tcp://[^"]*"' | head -1 | sed 's/"public_url":"tcp:\/\///;s/"//')
            if [ -n "$URL" ]; then
              break
            fi
            echo "En attente du tunnel... ($i/10)"
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Échec : impossible de récupérer l'URL du tunnel." >&2
            cat /tmp/ngrok.log
            exit 1
          fi

          HOST=$(echo "$URL" | cut -d: -f1)
          PORT=$(echo "$URL" | cut -d: -f2)

          echo "=================================================="
          echo "Tunnel ouvert : tcp://$URL"
          echo ""
          echo "1. Téléchargez la clé privée depuis l'onglet Artifacts"
          echo "   de ce run de workflow (nom: ssh-private-key)"
          echo ""
          echo "2. Localement :"
          echo "   chmod 600 id_rsa"
          echo "   ssh runner@$HOST -p $PORT -i id_rsa -o ServerAliveInterval=60"
          echo "=================================================="

          echo "SSH_HOST=$HOST" >> "$GITHUB_ENV"
          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Maintenir le tunnel ouvert
        run: |
          DURATION=$(( ${{ github.event.inputs.duration_minutes }} * 60 ))
          ELAPSED=0
          while [ $ELAPSED -lt $DURATION ]; do
            sleep 30
            ELAPSED=$((ELAPSED + 30))
            if ! pgrep -f "ngrok tcp" > /dev/null; then
              echo "ngrok s'est arrêté de manière inattendue." >&2
              cat /tmp/ngrok.log
              exit 1
            fi
            echo "Tunnel actif depuis $((ELAPSED / 60)) min / $((DURATION / 60)) min — Host: $SSH_HOST:$SSH_PORT"
          done
          echo "Durée maximale atteinte, fermeture du tunnel."
